project:
  type: book
  output-dir: docs

profile:
  default: book
  group:
    - [book, slides]

execute:
  freeze: auto
  cache: true

book:
  title: "Inverse Problems in Geophysics"
  author: "Thomas Günther (TU Bergakademie Freiberg)"
  chapters:
    - index.qmd
    - 01_introduction.qmd
    - part: "Linear problems"
      chapters:
        - 02_linear_problems.qmd
        - 03_resolution.qmd
        - 04_svd.qmd
    - part: "Regularization"
      chapters:
        - 05_regularization.qmd
        - 06_traveltime_tomography.qmd
        - 07_enhanced_regularization.qmd
    - part: "Non-linear problems"
      chapters:
        - 08_nonlinear_minimization.qmd
        - 09_simple_model.qmd
        - 10_probability.qmd
    - literature.qmd
bibliography: inv.bib
csl: harvard.csl
format:
  html:
    theme: cosmo
    number-sections: true
    lib-dir: site_libs
    code-fold: true
    code-summary: "Show the code"
    include-in-header:
      - text: |
          <script>
          window.MathJax = {
            loader: {
              load: ['[tex]/physics']
            },
            tex: {
              packages: {'[+]': ['physics']}
            }
          };
          </script>

editor: source